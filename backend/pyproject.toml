[project]
name = "challenge-fitness-backend"
version = "0.1.0"
description = "Backend API for Challenge Fitness Gym application"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "motor>=3.6.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.6",
    "certifi>=2024.2.2",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]
